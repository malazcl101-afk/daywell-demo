if(view==='focus'){h+=heading('Focus corner','One task, one timer, a little breathing room.');h+=`<div class="grid"><section class="panel tint"><h2>Focus timer</h2><div id="timer" class="timer" role="timer">${clock(timerSeconds)}</div><div class="actions">${btn(timerHandle?'Pause':'Start','timer','','')}${btn('Reset','resetTimer') }<select id="duration" aria-label="Timer length"><option value="1500">25 minutes</option><option value="600">10 minutes</option><option value="300">5 minutes</option></select></div><p class="note">The timer runs while this page is open. It does not send notifications.</p></section><section class="panel"><h2>Choose one step</h2>${taskRows(data.tasks.filter(t=>!t.done).slice(0,3))}</section></div>`}
if(view==='meals'){h+=heading('Meals & groceries','Keep food plans simple and your list close at hand.');let week=Array.from({length:7},(_,i)=>shift(i));h+=`<div class="grid"><section class="panel span2"><div class="top"><h2>Upcoming meals</h2>${btn('+ Plan meal','new','meals','')}</div><div class="list">${data.meals.sort((a,b)=>a.date.localeCompare(b.date)).map(m=>row(`<strong>${esc(m.text)}</strong><br><small>${esc(m.date)} · ${esc(m.type)}</small>`,m.id,'meals')).join('')||'<div class="empty">Plan a meal when you’re ready.</div>'}</div></section><section class="panel"><h2>Grocery list</h2><form id="groceryQuick" class="inline"><input name="text" maxlength="100" required placeholder="Add an item" aria-label="New grocery item"><button class="btn">Add</button></form><div class="list" style="margin-top:14px">${data.groceries.map(g=>`<div class="entry"><div class="inline"><input class="check" type="checkbox" data-check="grocery" data-id="${esc(g.id)}" aria-label="Bought ${esc(g.text)}" ${g.done?'checked':''}><span class="${g.done?'label':''}">${esc(g.text)}</span></div>${btn('×','delete','groceries:'+g.id,'small warn')}</div>`).join('')||'<div class="empty">Your grocery list is empty.</div>'}</div></section></div>`}
if(view==='money'){let m=date().slice(0,7),tx=data.transactions.filter(t=>t.date.startsWith(m)),spent=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),income=tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);h+=heading('Money, at a glance','Manual entries to help you see what is coming and going.');h+=`<div class="grid"><div class="panel tint"><div class="kicker">This month · income</div><div class="metric">${money(income)}</div></div><div class="panel peach"><div class="kicker">This month · spent</div><div class="metric">${money(spent)}</div></div><div class="panel lav"><div class="kicker">Budget remaining</div><div class="metric">${money(data.budget-spent)}</div></div><section class="panel span2"><div class="top"><h2>Entries</h2>${btn('+ Add entry','new','transactions','')}</div><div class="list">${[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>row(`<strong>${esc(t.category)}</strong> · ${esc(t.note)}<br><small>${esc(t.date)}</small>`,t.id,'transactions',`<strong>${t.type==='income'?'+':'−'}${money(t.amount)}</strong>`)).join('')||'<div class="empty">No entries yet.</div>'}</div></section><section class="panel"><h2>Monthly spending budget</h2><form id="budgetForm" class="inline"><input name="amount" type="number" min="0" max="100000000" step="0.01" aria-label="Monthly spending budget" value="${data.budget/100}"><button class="btn">Save</button></form><p class="note">Display currency can be changed in Settings. This does not convert amounts.</p></section></div>`}
if(view==='care'){h+=heading('Your wellness view','Notice patterns in your check-ins. Blank days simply mean no entry.');h+=`<div class="grid"><section class="panel span2"><h2>Wellness chart</h2>${wellnessChart()}</section><section class="panel tint"><h2>Today’s check-in</h2>${careCard()}</section><section class="panel"><h2>Recent days</h2><div class="list">${[...data.care].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(c=>`<div class="entry"><span><strong>${esc(c.date)} · ${esc(c.mood)}</strong><br><small>${esc(c.gratitude||'')} · ${c.water} glasses of water</small></span></div>`).join('')||'<div class="empty">No check-ins yet.</div>'}</div></section></div>`}
if(view==='notes'){h+=heading('Notes & thoughts','Catch what matters and return to it later.');h+=`${btn('+ New note','new','notes','')}<div class="grid" style="margin-top:16px">${data.notes.map(n=>`<section class="panel"><h2>${esc(n.title)}</h2><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><div class="actions">${btn('Edit','edit','notes:'+n.id)}${btn('Delete','delete','notes:'+n.id,'warn')}</div></section>`).join('')||'<div class="empty">Make a note to remember a thought.</div>'}</div>`}
if(view==='settings'){h+=heading('Make it yours','Choose a cozy look and keep a safe copy of your planner.');h+=`<div class="grid"><section class="panel span2"><h2>Cozy themes</h2><p class="muted">Pick a color palette. Your choice saves automatically.</p><div class="themes">${Object.entries(THEMES).map(([key,t])=>`<button class="theme-option ${data.theme===key?'selected':''}" data-action="theme" data-id="${key}" aria-label="Use ${t[0]} theme" aria-pressed="${data.theme===key}"><span class="swatch"><i style="background:${t[1]}"></i><i style="background:${t[2]}"></i><i style="background:${t[3]}"></i></span><strong>${t[0]}</strong></button>`).join('')}</div><div class="grid" style="margin-top:18px"><label class="field">Font<select data-appearance="font"><option value="system" ${data.font==='system'?'selected':''}>Clean sans</option><option value="rounded" ${data.font==='rounded'?'selected':''}>Soft rounded</option><option value="serif" ${data.font==='serif'?'selected':''}>Classic serif</option></select></label><label class="field">Spacing<select data-appearance="density"><option value="compact" ${data.density==='compact'?'selected':''}>Compact</option><option value="comfortable" ${data.density==='comfortable'?'selected':''}>Comfortable</option><option value="spacious" ${data.density==='spacious'?'selected':''}>Spacious</option></select></label><label class="field">Card style<select data-appearance="card"><option value="soft" ${data.card==='soft'?'selected':''}>Soft shadow</option><option value="outlined" ${data.card==='outlined'?'selected':''}>Clear outline</option></select></label><label class="field">Readability<select data-appearance="contrast"><option value="normal" ${data.contrast==='normal'?'selected':''}>Standard</option><option value="high" ${data.contrast==='high'?'selected':''}>Higher contrast</option></select></label></div><button class="btn alt" data-action="resetAppearance">Restore default appearance</button></section><section class="panel"><h2>Preferences</h2><label class="field">Display currency<select id="currency">${['USD','GBP','EUR','PKR','CAD','AUD'].map(c=>`<option ${data.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="note">The symbol changes; stored numbers do not convert.</p></section><section class="panel"><h2>Backup & restore</h2><div class="actions">${btn('Download backup','export','','') }<label class="btn alt" style="cursor:pointer">Import backup<input id="import" type="file" accept=".json,application/json" hidden></label></div><p class="note">The import replaces current records after confirmation.</p></section><section class="panel"><h2>Start again</h2><div class="actions">${DEMO?btn('Reset sample data','resetDemo'):''}${btn('Clear all records','clear','','warn')}</div><p class="note">Export a backup first if you want to keep anything.</p></section></div>`}
app.innerHTML=h+'<p class="foot">Daywell · Stored in this browser profile. No automatic cross-device sync. No account or reminders.</p>';}
function wellnessChart(){let days=Array.from({length:14},(_,i)=>shift(i-13)),colors={Calm:'#4e9e82',Good:'#d2a64c',Okay:'#9884bc',Tired:'#c88276',Overwhelmed:'#a66f87'},entries=days.map(d=>data.care.find(c=>c.date===d));let recorded=entries.filter(Boolean),water=recorded.length?Math.round(recorded.reduce((n,c)=>n+Number(c.water||0),0)/recorded.length*10)/10:0;return `<p class="muted">Last 14 days · ${recorded.length} check-in${recorded.length===1?'':'s'} · ${water} glasses of water on recorded days (average)</p><div class="wellness-chart" role="img" aria-label="Mood entries for the last fourteen days">${days.map((d,i)=>{let c=entries[i],color=colors[c?.mood]||'#aabdb0';return `<div class="wellness-day" title="${d}: ${esc(c?.mood||'No entry')}, ${c?.water||0} glasses"><span>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</span><span class="mooddot" style="background:${c?.mood?color:'transparent'};color:${color}"></span><small>${esc(c?.mood||'—')}</small></div>`}).join('')}</div><div class="chartlabel"><span>Water recorded each day</span><span>Scale: 0–10+ glasses</span></div><div class="waterbars" role="img" aria-label="Water intake for each of the last fourteen days">${entries.map((c,i)=>`<span title="${days[i]}: ${c?.water??'no entry'} glasses" style="height:${c?Math.max(4,Math.min(100,Number(c.water||0)*10)):2}%;opacity:${c?.water ? .7 : .18}"></span>`).join('')}</div><p class="note">The chart reflects only saved check-ins. It does not diagnose health conditions.</p>`}function careCard(){let c=data.care.find(x=>x.date===date())||{mood:'',water:0,gratitude:''};return `<form id="careForm"><label class="field">Mood<select name="mood"><option value="">Choose a word</option>${['Calm','Good','Okay','Tired','Overwhelmed'].map(x=>`<option ${c.mood===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Glasses of water<input type="number" name="water" min="0" max="30" value="${c.water}"></label><label class="field">Something you appreciate<input name="gratitude" maxlength="160" value="${esc(c.gratitude)}" placeholder="Even a tiny thing counts"></label><button class="btn">Save check-in</button></form>`}function habitSummary(){return data.habits.length?data.habits.map(h=>`<div class="entry"><span>${esc(h.name)}</span><button class="btn small ${h.marks.includes(date())?'alt':''}" data-action="mark" data-id="${esc(h.id)}|${date()}">${h.marks.includes(date())?'✓ Done':'Mark today'}</button></div>`).join(''):'<p>No habits yet. Add one in Habits.</p>'}function clock(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function stop(){clearInterval(timerHandle);timerHandle=null;timerEnd=0}function renderTimer(){let e=document.querySelector('#timer');if(e)e.textContent=clock(timerSeconds)}
const specs={tasks:[['text','Step','text','120'],['date','Date','date']],habits:[['name','Habit','text','80']],meals:[['text','Meal','text','100'],['date','Date','date'],['type','Meal time','select','Breakfast|Lunch|Dinner|Snack']],transactions:[['type','Type','select','expense|income'],['category','Category','text','45'],['amount','Amount','number'],['date','Date','date'],['note','Note','text','100']],notes:[['title','Title','text','80'],['body','Note','textarea','2000']]};function showForm(type,id=''){formType=type;editId=id;let item=data[type].find(x=>x.id===id)||{};modalTitle.textContent=(id?'Edit ':'Add ')+({tasks:'step',habits:'habit',meals:'meal',transactions:'entry',notes:'note'}[type]);formFields.innerHTML=specs[type].map(([key,label,kind,opt])=>`<label class="field">${label}${kind==='select'?`<select name="${key}">${opt.split('|').map(v=>`<option value="${v}" ${item[key]===v?'selected':''}>${v}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${key}" maxlength="${opt}">${esc(item[key]||'')}</textarea>`:`<input name="${key}" type="${kind}" ${kind==='number'?'min="0.01" max="100000000" step="0.01"':''} ${opt&&kind==='text'?`maxlength="${opt}"`:''} value="${esc(key==='amount'&&item.amount!=null?item.amount/100:item[key]??(kind==='date'?selected:''))}" required>`}</label>`).join('');modal.showModal()}
document.querySelector('#cancel').onclick=()=>modal.close();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let {action,id}=b.dataset;if(action==='resetAppearance'){Object.assign(data,{theme:'mint',font:'system',density:'comfortable',card:'soft',contrast:'normal'});save();return}if(action==='goto'){view=id;render();return}if(action==='theme'){data.theme=id;save();return}if(action==='new'){showForm(id);return}if(action==='edit'){let [type,key]=id.split(':');showForm(type,key);return}if(action==='delete'){let [type,key]=id.split(':');if(confirm('Delete this item?')){data[type]=data[type].filter(x=>x.id!==key);save()}return}if(action==='mark'){let [key,d]=id.split('|'),h=data.habits.find(x=>x.id===key);if(!h)return;h.marks=h.marks.includes(d)?h.marks.filter(x=>x!==d):[...h.marks,d];save();return}if(action==='selectDay'){selected=id;render();return}if(action==='prev'||action==='next'){let d=new Date(year,month+(action==='next'?1:-1),1);year=d.getFullYear();month=d.getMonth();render();return}if(action==='timer'){if(timerHandle){timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));stop();render()}else{timerEnd=Date.now()+timerSeconds*1000;timerHandle=setInterval(()=>{timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));renderTimer();if(!timerSeconds){stop();alert('Focus session complete. Take a breath.')}},250);b.textContent='Pause'}return}if(action==='resetTimer'){stop();timerSeconds=Number(document.querySelector('#duration')?.value||1500);render();return}if(action==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daywell-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}if(action==='resetDemo'&&confirm('Replace all demo changes with sample data?')){data=initial();save()}if(action==='clear'&&confirm('Delete every record? Download a backup first if needed.')){data=initial();for(let k of ['tasks','habits','meals','groceries','transactions','care','notes'])data[k]=[];data.budget=0;save()}});
app.addEventListener('change',async e=>{let t=e.target;if(t.dataset.appearance){data[t.dataset.appearance]=t.value;save()}if(t.id==='dayDate'){selected=t.value;render()}if(t.id==='currency'){data.currency=t.value;save()}if(t.id==='duration'&&!timerHandle){timerSeconds=Number(t.value);renderTimer()}if(t.dataset.check){let collection=t.dataset.check==='task'?'tasks':'groceries',item=data[collection].find(x=>x.id===t.dataset.id);if(item){item.done=t.checked;save()}}if(t.id==='import'){let f=t.files[0];if(!f)return;try{if(f.size>3000000)throw Error('Backup exceeds 3 MB');let x=JSON.parse(await f.text());if(!validate(x))throw Error('Invalid or unsupported backup');x.theme=THEMES[x.theme]?x.theme:'mint';if(confirm('Replace your current planner with this backup?')){data=x;save()}}catch(err){alert('Could not import: '+err.message)}t.value=''}});
app.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='quick'){let x=f.elements;data.tasks.push({id:uid(),text:x.text.value.trim(),date:x.date.value,done:false});save()}if(f.id==='groceryQuick'){data.groceries.push({id:uid(),text:f.elements.text.value.trim(),done:false});save()}if(f.id==='budgetForm'){let n=Math.round(Number(f.elements.amount.value)*100);if(Number.isSafeInteger(n)&&n>=0){data.budget=n;save()}}if(f.id==='careForm'){let x=f.elements,n=Number(x.water.value);if(!Number.isInteger(n)||n<0||n>30)return alert('Water must be between 0 and 30');let c={date:date(),mood:x.mood.value,water:n,gratitude:x.gratitude.value.trim()};data.care=data.care.filter(y=>y.date!==c.date);data.care.push(c);save()}});form.onsubmit=e=>{e.preventDefault();let o={id:editId||uid()};for(let [key,,kind] of specs[formType]){let v=form.elements[key].value.trim();if(key==='amount'){v=Math.round(Number(v)*100);if(!Number.isSafeInteger(v)||v<=0)return alert('Enter a valid amount')}o[key]=v}if(formType==='tasks')o.done=data.tasks.find(t=>t.id===editId)?.done||false;if(formType==='habits')o.marks=data.habits.find(h=>h.id===editId)?.marks||[];let i=data[formType].findIndex(x=>x.id===editId);if(i<0)data[formType].push(o);else data[formType][i]=o;modal.close();save()};render();
</script></html>
